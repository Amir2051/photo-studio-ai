name: Deploy Every Frame First Studio to GitHub Pages

on:
  # The integration branch owns the deployable editor. Keep this workflow
  # manual-only so pushes to the legacy main branch cannot publish an older UI.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integrated studio
        uses: actions/checkout@v4
        with:
          ref: fix/photo-studio-core-repair
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run root application tests
        run: npx vitest run tests
      - name: Type-check and build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm GitHub Pages is enabled
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build and deploy Minu Studio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install BrainCUT editor dependencies
        run: npm ci --prefix vendor/braincut
      - name: Check BrainCUT editor
        run: npm run check --prefix vendor/braincut
      - name: Test BrainCUT editor
        run: npm test --prefix vendor/braincut
      - name: Run root application tests
        run: npx vitest run tests
      - name: Type-check and build
        run: npm run build
      - name: Verify published editor bundle
        run: |
          test -s public/video-studio/index.html
          grep -R -q 'CLIP ACTIONS' public/video-studio/_app/immutable
          grep -R -q 'PRODUCER AUDIO DESK' public/video-studio/_app/immutable
      - name: Copy custom-domain CNAME into the Pages artifact
        run: cp CNAME dist/CNAME
      - name: Add SPA fallback for client-side routes
        run: cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Confirm GitHub Pages is enabled in repository settings
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    if: github.event_name != 'pull_request' && needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the production routes and guest signaling
        run: node scripts/smoke-production.mjs
